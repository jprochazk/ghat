# Do not edit: this file is generated by `ghat generate`.
name: ghat check
on:
  push: {}
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
    - id: step_0
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: '1'
    - id: step_1
      run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/jprochazk/ghat/releases/latest/download/ghat-installer.sh | sh
    - id: step_2
      run: ghat generate
    - id: step_3
      run: git diff --exit-code
